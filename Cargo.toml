[package]
name = "glg"
version = "1.0.0"
edition = "2021"
authors = ["GLG Contributors"]
description = "Granular License Generator - A modern license compiler for generating deterministic, granular software licenses"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glg-project/glg"
readme = "README.md"
keywords = ["license", "spdx", "legal", "open-source", "compiler"]
categories = ["command-line-utilities", "encoding"]
rust-version = "1.75"

[[bin]]
name = "glg"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
rand = "0.8"
qrcode = "0.14"
askama = "0.12"
pulldown-cmark = "0.9"
clap = { version = "4", features = ["derive", "cargo"] }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
walkdir = "2"
ignore = "0.4"
git2 = "0.18"
rayon = "1"
parking_lot = "0.12"
once_cell = "1"
thiserror = "1"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
regex = "1"
similar = "2"
termcolor = "1"
open = "5"
tempfile = "3"
include_dir = "0.7"
static_assertions = "1"
zerocopy = { version = "0.7", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[build-dependencies]
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
